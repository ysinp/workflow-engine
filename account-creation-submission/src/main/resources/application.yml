server:
  port: 8082

spring:
  application:
    name: account-creation-submission
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 8000

services:
  orchestration-engine:
    base-url: ${ORCHESTRATION_ENGINE_URL:http://localhost:8081}
  create-account:
    base-url: ${CREATE_ACCOUNT_SERVICE_URL:http://localhost:8083}

# Must match create-account's jwt.secret exactly - this service verifies (never issues) the JWT
# create-account signs, to gate the compliance decision/queue endpoints to the REVIEWER role.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-this-needs-to-be-at-least-32-bytes-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.95,0.99
