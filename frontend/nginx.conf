server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path not matching a real file falls back to index.html
    # so client-side routes (/signin, /dashboard, /review, ...) work on direct
    # navigation and on refresh, not just via in-app <Link> clicks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated - it references the current build's hashed
    # asset filenames, and a browser-cached copy would keep pointing at stale/deleted
    # assets (and stale routes) after every redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints every filename in assets/ with a content hash, so these are safe
    # to cache aggressively - a code change always produces a new URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
