global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'create-account'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['create-account:8083']

  - job_name: 'temporal-orchestration-workflow-engine'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['temporal-orchestration-workflow-engine:8081']

  - job_name: 'risk-score'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['risk-score:8084']

  - job_name: 'temporal-server'
    metrics_path: /metrics
    static_configs:
      - targets: ['temporal:9090']
